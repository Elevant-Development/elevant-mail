[package]
name = "elevant-mail"
description = "A fast, private desktop mail client for Linux and Windows"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# The binary is a thin wrapper around this library (Tauri's standard layout).
name = "elevant_mail_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
elevant-mail-core.workspace = true
elevant-mail-mcp.workspace = true
# The app's data folder for `elevant-mail mcp`, which runs without Tauri: the same as Tauri's.
dirs = "6"
open.workspace = true
percent-encoding.workspace = true
serde.workspace = true
# The tray icon keeps the app running with its window closed.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Only the save dialog, called from Rust; the frontend gets no dialog permission.
tauri-plugin-dialog = "2"
# Desktop notifications for new mail, shown by the frontend.
tauri-plugin-notification = "2"
# Starting at login (off by default), switched from Rust; the frontend gets no permission.
tauri-plugin-autostart = "2"
# A second start shows the running app instead of opening the database twice.
tauri-plugin-single-instance = "2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
