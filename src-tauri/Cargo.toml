[package]
name = "elevant-mail"
description = "A fast, private desktop mail client for Linux and Windows"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# The binary is a thin wrapper around this library (Tauri's standard layout).
name = "elevant_mail_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
elevant-mail-core.workspace = true
open.workspace = true
percent-encoding.workspace = true
serde.workspace = true
tauri = { version = "2", features = [] }
# Only the save dialog, called from Rust; the frontend gets no dialog permission.
tauri-plugin-dialog = "2"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
