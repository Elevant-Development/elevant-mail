# cargo-deny: licences compatible with GPL-3.0-or-later, known vulnerabilities, trusted sources.
# Run locally with `cargo deny check`.

[advisories]
version = 2
# Vulnerabilities fail everywhere. "Unmaintained" only for our direct dependencies: the ones
# deep in Tauri's and the keyring's trees (gtk-rs macros, zbus) are theirs to replace.
unmaintained = "workspace"
# chrono and chrono-tz were declared unmaintained in November 2026, with no version that fixes
# it. The calendar builds on them, calcard too. Moving to jiff is a change of its own; until then
# they stay, as they work as before.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained, no upgrade; moving to jiff separately" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz: unmaintained, no upgrade; calcard needs it too" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace crates refer to each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
