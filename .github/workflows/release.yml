name: Release

# A tag like v0.3.0 builds the installers and attaches them to a draft release, which is
# published by hand after a smoke test with real accounts.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu LTS runner: an older glibc lets the AppImage run on older systems.
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Elevant Mail ${{ github.ref_name }}
          releaseBody: |
            Installers for Linux (.deb, .AppImage) and Windows (.exe).
            Not code-signed yet: Windows SmartScreen asks once ("More info" → "Run anyway").
          releaseDraft: true
          args: --bundles ${{ matrix.bundles }}
