[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
ammonia = "4"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
elevant-mail-core = { path = "crates/core" }
futures = "0.3"
hickory-resolver = "0.26"
keyring = "4.2"
mail-parser = "1"
open = "5"
percent-encoding = "2"
rcgen = "0.14"
# TLS comes from our own rustls config (ring + platform verifier), like the IMAP client.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "macros", "rt-multi-thread", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "12"
url = "2"
utf7-imap = "0.3"
uuid = { version = "1", features = ["v7"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
